name: Auto Deploy to Production

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Increase timeout to 30 minutes

    steps:
    - name: Deploy to VPS via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_PORT || 22 }}
        script_stop: true
        script: |
          set -e

          echo "=== Starting Deployment ==="
          echo "Project Path: ${{ secrets.PROJECT_PATH || '/home/hibhaqqi/code/biztrackkos-2' }}"

          # Navigate to project directory
          cd ${{ secrets.PROJECT_PATH || '/home/hibhaqqi/code/biztrackkos-2' }}

          echo "Step 1: Pulling latest changes..."
          git fetch origin
          git reset --hard origin/master
          git pull origin master

          echo "Step 2: Stopping running containers..."
          docker compose down || true

          echo "Step 3: Cleaning old build cache..."
          docker builder prune -f
          docker system prune -f

          echo "Step 4: Building new images (this may take 3-5 minutes)..."
          echo "Please be patient, npm install can take several minutes..."
          docker compose build --no-cache --progress=plain

          echo "Step 5: Starting containers..."
          docker compose up -d --force-recreate

          echo "Step 6: Waiting for database to be ready..."
          sleep 15

          echo "Step 7: Running Prisma migrations..."
          docker compose exec -T app npx prisma db push --skip-generate || echo "Migration skipped or already applied"

          echo "Step 8: Waiting for application to be healthy..."
          sleep 20

          echo "Step 9: Checking container status..."
          docker compose ps

          echo "Step 10: Checking application health..."
          curl -f http://localhost:9002 || echo "Warning: Application not responding yet, please check manually"

          echo "Step 11: Showing recent logs..."
          docker compose logs --tail=100 app

          echo "=== Deployment Complete ==="
          echo "✅ Application should be available at http://${{ secrets.VPS_HOST }}:9002"
          echo ""
          echo "If something went wrong, check logs with:"
          echo "  docker compose logs -f app"
          echo ""
          echo "Useful commands:"
          echo "  View logs: docker compose logs -f app"
          echo "  Restart: docker compose restart"
          echo "  Stop: docker compose down"
